version: '3'

services:
  victim:
    image: lab02_image
    container_name: lab04_victim
    hostname: victim
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./attack:/attack
    networks:
      labnet:
        ipv4_address: 10.2.6.20

  attacker:
    image: lab02_image
    container_name: lab04_attacker
    hostname: attacker
    tty: true
    stdin_open: true
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./attack:/attack
    networks:
      labnet:
        ipv4_address: 10.2.6.51

  user:
    image: lab02_image
    container_name: lab04_user
    hostname: user
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 10.2.6.10

  dns:
    image: seed-local-dns-server
    container_name: lab04_dns
    hostname: dns
    tty: true
    stdin_open: true
    networks:
      labnet:
        ipv4_address: 10.2.6.53

networks:
  labnet:
    name: net-10.2.6.0
    driver: bridge
    ipam:
      config:
        - subnet: 10.2.6.0/24
